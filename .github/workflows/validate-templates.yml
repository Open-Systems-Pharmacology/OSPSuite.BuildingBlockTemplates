name: Validate Templates

on:
  push:
    paths:
      - 'templates.json'
    branches-ignore:
      - main
  pull_request:
    paths:
      - 'templates.json'
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  validate-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Validate templates.json links and names
        run: python .github/scripts/validate_templates.py