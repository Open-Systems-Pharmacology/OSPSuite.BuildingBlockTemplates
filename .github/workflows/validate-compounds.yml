name: Validate Compound Templates

on:
  push:
    paths:
      - 'templates.json'
    branches-ignore:
      - main
  pull_request:
    paths:
      - 'templates.json'
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  validate-compounds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate compound templates
        #parameter passed to the python script: pipe-separated list of compound names to be ignored by the check
        run: python .github/scripts/validate_compounds.py "Tefibazumab__Kd_Zhou2003"